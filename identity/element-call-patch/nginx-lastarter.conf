server {
    listen 8080;
    server_name _;
    root /app;
    index index.html;

    # SPA : toutes les routes retombent sur l'index.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Les assets hashes peuvent rester caches longtemps.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
