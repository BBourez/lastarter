# Thème de login Keycloak « lastarter » — LaStarter.
# Drop-in : survit aux mises à jour Keycloak (aucune modification du serveur),
# monté en lecture seule dans /opt/keycloak/themes/lastarter.
# styles : on reprend celui du parent (résolu par fallback) + le nôtre.
parent=keycloak
import=common/keycloak
styles=css/login.css css/lastarter.css
