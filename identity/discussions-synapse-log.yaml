# Log config Synapse — Discussions (rendu tel quel par le CLI).
version: 1

formatters:
    precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'

handlers:
    console:
        class: logging.StreamHandler
        formatter: precise

loggers:
    synapse:
        level: INFO

    twisted:
        level: INFO

root:
    level: INFO
    handlers: [console]
