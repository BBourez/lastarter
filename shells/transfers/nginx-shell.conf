# LaStarter Shell — Transfers : nginx config.
# / → shell statique (sidebar Element Web)
# /app/ → proxy vers l'app originale (transfers_app:8000)
# /api/ → proxy vers le backend API

server {
    listen 80;
    server_name _;

    # Shell statique (React build)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # App originale (dans l'iframe)
    location /app/ {
        proxy_pass http://transfers_frontend:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        # Masquer la sidebar/header de l'app dans l'iframe
        sub_filter '</head>' '<style>.c__left-panel,.c__header,header,[class*="topbar"]{display:none!important}</style></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # API backend (session Django)
    location /api/ {
        proxy_pass http://transfers_app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
    }
}
