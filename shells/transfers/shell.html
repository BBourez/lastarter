<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transfers — LaStarter</title>
    <link rel="stylesheet" href="/__lastarter/theme.css" />
    <style>
        /* Shell layout : sidebar + iframe */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; overflow: hidden; font-family: var(--cpd-font-family-sans, 'Inter', sans-serif); }

        /* Sidebar (copie Element Web) */
        .ls-sidebar {
            width: 260px; min-width: 224px; height: 100vh; flex-shrink: 0;
            background: #ffffff; border-right: 1px solid #e1e6ec;
            display: flex; flex-direction: column;
        }
        .ls-sidebar__search {
            margin: 8px; display: flex; align-items: center; gap: 8px;
            height: 36px; padding: 0 12px; border-radius: 9999px;
            border: 1px solid #e1e6ec; background: #f0f2f5;
            color: #656d77; font-size: 13px; cursor: pointer;
        }
        .ls-sidebar__nav { flex: 1; overflow-y: auto; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; }
        .ls-sidebar__section { padding: 12px 12px 4px; font-size: 11px; font-weight: 500; color: #656d77; }
        .ls-sidebar__item {
            display: flex; align-items: center; gap: 12px; min-height: 36px;
            padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500;
            color: #1b1d22; text-decoration: none; cursor: pointer; background: transparent; border: none;
            transition: background 0.1s; font-family: inherit;
        }
        .ls-sidebar__item:hover { background: #f0f2f5; }
        .ls-sidebar__item.active { background: #e3f7ed; color: #007a61; }
        .ls-sidebar__item-icon { width: 20px; text-align: center; font-size: 16px; }
        .ls-sidebar__item-label { flex: 1; }

        /* User menu en bas (copie Element Web) */
        .ls-sidebar__user { border-top: 1px solid #e1e6ec; padding: 8px; display: flex; align-items: center; gap: 10px; }
        .ls-user__avatar {
            width: 32px; height: 32px; border-radius: 50%; background: #e3f7ed; color: #007a61;
            display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0;
        }
        .ls-user__info { flex: 1; min-width: 0; }
        .ls-user__name { display: block; font-size: 13px; font-weight: 600; color: #1b1d22; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ls-user__email { display: block; font-size: 11px; color: #656d77; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ls-user__settings {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: none; background: transparent; color: #656d77; cursor: pointer; flex-shrink: 0;
        }
        .ls-user__settings:hover { background: #e1e6ec; color: #1b1d22; }

        /* Contenu : iframe de l'app */
        .ls-content { flex: 1; min-width: 0; height: 100vh; }
        .ls-content iframe { width: 100%; height: 100%; border: none; display: block; }

        @media (max-width: 768px) { .ls-sidebar { display: none; } }
    </style>
</head>
<body>
    <aside class="ls-sidebar">
        <button class="ls-sidebar__search" onclick="focusSearch()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10Zm4.5-1L14 13.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            <span>Rechercher…</span>
        </button>
        <nav class="ls-sidebar__nav" id="nav">
            <div class="ls-sidebar__section">Transferts</div>
            <a class="ls-sidebar__item active" href="#" onclick="navigate(event, '')">
                <span class="ls-sidebar__item-icon">📨</span>
                <span class="ls-sidebar__item-label">Nouveau transfert</span>
            </a>
            <a class="ls-sidebar__item" href="#" onclick="navigate(event, 'sent')">
                <span class="ls-sidebar__item-icon">📤</span>
                <span class="ls-sidebar__item-label">Envoyés</span>
            </a>
            <a class="ls-sidebar__item" href="#" onclick="navigate(event, 'received')">
                <span class="ls-sidebar__item-icon">📥</span>
                <span class="ls-sidebar__item-label">Reçus</span>
            </a>
        </nav>
        <div class="ls-sidebar__user">
            <span class="ls-user__avatar" id="avatar">…</span>
            <span class="ls-user__info">
                <span class="ls-user__name" id="userName">Chargement…</span>
                <span class="ls-user__email" id="userEmail"></span>
            </span>
            <button class="ls-user__settings" onclick="openSettings()" aria-label="Paramètres">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle cx="9" cy="9" r="2.5" stroke="currentColor" strokeWidth="1.5"/>
                    <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.8 3.8l1.4 1.4M12.8 12.8l1.4 1.4M14.2 3.8l-1.4 1.4M5.2 12.8l-1.4 1.4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                </svg>
            </button>
        </div>
    </aside>
    <main class="ls-content">
        <iframe id="appFrame" src="/app/" title="Transfers"></iframe>
    </main>

    <script>
        // Récupérer l'utilisateur depuis l'API de l'app
        fetch("/api/v1.0/users/me/", { credentials: "include" })
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(user) {
                if (!user) return;
                document.getElementById("userName").textContent = user.full_name || user.email.split("@")[0];
                document.getElementById("userEmail").textContent = user.email;
                var initials = (user.full_name || user.email).split(" ").map(function(w) { return w[0]; }).slice(0, 2).join("").toUpperCase();
                document.getElementById("avatar").textContent = initials;
            })
            .catch(function() {});

        // Navigation : changer l'URL de l'iframe
        function navigate(e, path) {
            e.preventDefault();
            document.querySelectorAll(".ls-sidebar__item").forEach(function(el) { el.classList.remove("active"); });
            e.currentTarget.classList.add("active");
            document.getElementById("appFrame").src = "/app/" + (path ? "#" + path : "");
        }

        function focusSearch() {
            // TODO : implémenter la recherche
        }

        function openSettings() {
            document.getElementById("appFrame").src = "/app/#settings";
        }
    </script>
</body>
</html>
