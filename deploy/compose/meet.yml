# Brique meet â€” visioconfÃ©rence (lasuite/meet-{backend,frontend} v1.35.0).
# Services prÃ©fixÃ©s meet_* ; infra via env_file de la brique (catalogue/meet.toml).

services:
  meet_postgresql:
    image: postgres:16
    env_file: ["${RUNTIME_DIR}/meet.env"]
    volumes:
      - meet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 150
    networks: [lastarter]

  meet_redis:
    image: redis:5
    networks: [lastarter]

  meet_garage:
    image: dxflrs/garage:v2.4.1
    command: /garage server --single-node --default-bucket
    env_file: ["${RUNTIME_DIR}/meet.env"]
    # Média exposé via la passerelle (meet-media.<domaine>), plus de port hôte.
    volumes:
      - ./files/garage-meet.toml:/etc/garage.toml:ro
      - meet_garagedata:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 3s
      timeout: 20s
      retries: 100
    networks: [lastarter]

  meet_garage_cors:
    image: amazon/aws-cli
    env_file: ["${RUNTIME_DIR}/meet.env"]
    environment:
      AWS_ENDPOINT_URL: http://meet_garage:9000
      AWS_DEFAULT_REGION: local
    entrypoint: >
      sh -c '
      aws s3api put-bucket-cors --bucket $$GARAGE_DEFAULT_BUCKET
      --cors-configuration "{\"CORSRules\": [{\"AllowedOrigins\": [\"'"'"'$$MEET_BASE_URL'"'"'\"], \"AllowedMethods\": [\"GET\", \"HEAD\", \"PUT\"], \"AllowedHeaders\": [\"*\"], \"ExposeHeaders\": [\"ETag\"]}]}" ;
      exit 0'
    depends_on:
      meet_garage:
        condition: service_healthy
    networks: [lastarter]

  meet_livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--config", "/config.yaml"]
    volumes:
      - ./files/livekit-meet.yaml:/config.yaml:ro
    ports:
      - "7880:7880"       # websocket signalisation (aussi routÃ© par la passerelle)
      - "7881:7881"       # RTC tcp
      - "7882:7882/udp"   # RTC udp
    depends_on:
      meet_redis:
        condition: service_started
    networks: [lastarter]

  meet_app:
    image: lasuite/meet-backend:v1.35.0
    env_file: ["${RUNTIME_DIR}/meet.env"]
    extra_hosts:
      # LIVEKIT_API_URL est publique (ws://livekit.<domaine>) : le backend la rÃ©sout
      # via l'hÃ´te (passerelle), le navigateur via *.localhost â†’ mÃªme URL partout.
      - "livekit.${LASTARTER_HOST:-localhost}:host-gateway"
    depends_on:
      meet_postgresql:
        condition: service_healthy
      meet_redis:
        condition: service_started
      meet_garage_cors:
        condition: service_completed_successfully
      meet_livekit:
        condition: service_started
    networks: [lastarter]

  meet_celery:
    image: lasuite/meet-backend:v1.35.0
    command: ["celery", "-A", "meet.celery_app", "worker", "-l", "INFO", "--pool", "solo"]
    env_file: ["${RUNTIME_DIR}/meet.env"]
    extra_hosts:
      - "livekit.${LASTARTER_HOST:-localhost}:host-gateway"
    depends_on:
      meet_app:
        condition: service_started
    networks: [lastarter]

  meet_frontend:
    image: lasuite/meet-frontend:v1.35.0
    networks: [lastarter]

volumes:
  meet_pgdata:
  meet_garagedata:
