# Brique keycloak — identité et SSO (quay.io/keycloak/keycloak:26.3.2).
# Realm importé au premier démarrage (identity/realm-lastarter.json rendu par le CLI).

services:
  kc_postgresql:
    image: postgres:14.3
    env_file: ["${RUNTIME_DIR}/keycloak.env"]
    volumes:
      - kc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 150
    networks: [lastarter]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm"]
    env_file: ["${RUNTIME_DIR}/keycloak.env"]
    volumes:
      # Rendu par le CLI (secrets substitués) — jamais commité.
      - ${REALM_JSON_PATH}:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      kc_postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      start_period: 20s
      interval: 3s
      timeout: 3s
      retries: 100
    networks: [lastarter]

  # Passerelle d'entrée unique : apex → Keycloak, <app>.<domaine> → app.
  # Conf générée par le CLI (.runtime/edge.conf) selon les briques sélectionnées.
  gateway:
    image: nginx:1.25-alpine
    ports:
      - "${EDGE_PORT:-8083}:8083"
    volumes:
      - ${EDGE_CONF_PATH}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/realms/lastarter/.well-known/openid-configuration || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s
    networks: [lastarter]

volumes:
  kc_pgdata:
