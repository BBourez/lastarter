# Brique keycloak — identité et SSO (quay.io/keycloak/keycloak:26.8.1).
# Realm importé au premier démarrage (identity/realm-lastarter.json rendu par le CLI).

services:
  kc_postgresql:
    image: postgres:18-alpine
    env_file: ["${RUNTIME_DIR}/keycloak.env"]
    volumes:
      - kc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 150
    networks: [lastarter]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    env_file: ["${RUNTIME_DIR}/keycloak.env"]
    volumes:
      # Rendu par le CLI (secrets substitués) — jamais commité.
      - ${REALM_JSON_PATH}:/opt/keycloak/data/import/realm.json:ro
      # Thème de login LaStarter (drop-in, committé dans identity/).
      - ${THEME_DIR}/lastarter:/opt/keycloak/themes/lastarter:ro
    depends_on:
      kc_postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      start_period: 20s
      interval: 3s
      timeout: 3s
      retries: 100
    networks: [lastarter]

  # Portail d'entrée (statique, zéro dépendance) : launchpad des briques actives.
  # Dossier complet matérialisé par le CLI dans .runtime/portal/ (pages + config).
  portal:
    image: nginx:1.25-alpine
    volumes:
      - ${PORTAL_DIR}:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [lastarter]

  # Passerelle d'entrée unique (TLS) : apex → Keycloak, <app>.<domaine> → app.
  # Conf générée par le CLI (.runtime/edge.conf) ; certificats POC (CA locale)
  # générés par le CLI dans .runtime/certs/ — en prod : certificats du client.
  gateway:
    image: nginx:1.25-alpine
    ports:
      - "${EDGE_PORT:-8443}:8443"
    volumes:
      - ${EDGE_CONF_PATH}:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR}:/etc/nginx/certs:ro
      - ${THEME_CSS_PATH}:/var/www/lastarter-theme/theme.css:ro
      - ./files/auto-login.js:/var/www/lastarter-theme/auto-login.js:ro
      - ./files/fonts:/var/www/lastarter-theme/fonts:ro
      # Branding client (logo) : rempli par le CLI dans .runtime/branding/.
      - ${BRANDING_DIR}:/var/www/lastarter-theme/branding:ro
    # Alias réseau : les conteneurs résolvent id.<domaine> → passerelle.
    # Nécessaire pour les apps qui utilisent la découverte OIDC (issuer public).
    networks:
      lastarter:
        aliases:
          - id.${LASTARTER_HOST}
          - livekit.${LASTARTER_HOST}
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/realms/lastarter/.well-known/openid-configuration || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s

volumes:
  kc_pgdata:
