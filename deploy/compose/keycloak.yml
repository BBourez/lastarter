# Brique keycloak â€” identitÃ© et SSO (quay.io/keycloak/keycloak:26.3.2).
# Realm importÃ© au premier dÃ©marrage (identity/realm-lastarter.json rendu par le CLI).

services:
  kc_postgresql:
    image: postgres:14.3
    env_file: ["${RUNTIME_DIR}/keycloak.env"]
    volumes:
      - kc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 150
    networks: [lastarter]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm"]
    env_file: ["${RUNTIME_DIR}/keycloak.env"]
    volumes:
      # Rendu par le CLI (secrets substituÃ©s) â€” jamais commitÃ©.
      - ${REALM_JSON_PATH}:/opt/keycloak/data/import/realm.json:ro
      # ThÃ¨me de login LaStarter (drop-in, committÃ© dans identity/).
      - ${THEME_DIR}/lastarter:/opt/keycloak/themes/lastarter:ro
    depends_on:
      kc_postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      start_period: 20s
      interval: 3s
      timeout: 3s
      retries: 100
    networks: [lastarter]

  # Portail d'entrÃ©e (statique, zÃ©ro dÃ©pendance) : launchpad des briques actives.
  # Dossier complet matÃ©rialisÃ© par le CLI dans .runtime/portal/ (pages + config).
  portal:
    image: nginx:1.25-alpine
    volumes:
      - ${PORTAL_DIR}:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [lastarter]

  # Passerelle d'entrÃ©e unique (TLS) : apex â†’ Keycloak, <app>.<domaine> â†’ app.
  # Conf gÃ©nÃ©rÃ©e par le CLI (.runtime/edge.conf) ; certificats POC (CA locale)
  # gÃ©nÃ©rÃ©s par le CLI dans .runtime/certs/ â€” en prod : certificats du client.
  gateway:
    image: nginx:1.25-alpine
    ports:
      - "${EDGE_PORT:-8443}:8443"
    volumes:
      - ${EDGE_CONF_PATH}:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR}:/etc/nginx/certs:ro
      - ${THEME_CSS_PATH}:/var/www/lastarter-theme/theme.css:ro
      - ./files/auto-login.js:/var/www/lastarter-theme/auto-login.js:ro
      - ./files/fonts:/var/www/lastarter-theme/fonts:ro
    # Alias rÃ©seau : les conteneurs rÃ©solvent id.<domaine> â†’ passerelle.
    # NÃ©cessaire pour les apps qui utilisent la dÃ©couverte OIDC (issuer public).
    networks:
      lastarter:
        aliases:
          - id.localhost
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/realms/lastarter/.well-known/openid-configuration || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s

volumes:
  kc_pgdata:
