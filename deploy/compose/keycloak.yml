# Brique keycloak — identité et SSO (quay.io/keycloak/keycloak:26.3.2).
# Realm importé au premier démarrage (identity/realm-lastarter.json rendu par le CLI).

services:
  kc_postgresql:
    image: postgres:14.3
    environment:
      POSTGRES_DB: ${KC_DB_URL_DATABASE}
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - kc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME} -d ${KC_DB_URL_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 150
    networks: [lastarter]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm"]
    env_file: ["${RUNTIME_DIR}/keycloak.env"]
    volumes:
      # Rendu par le CLI (secrets substitués) — jamais commité.
      - ${REALM_JSON_PATH}:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:39900:9000"     # management (health/metrics) — accès local uniquement
      # 8080 n'est pas publié : l'edge nginx de la brique exposante route /realms → keycloak:8080
    depends_on:
      kc_postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      start_period: 20s
      interval: 3s
      timeout: 3s
      retries: 100
    networks: [lastarter]

volumes:
  kc_pgdata:
