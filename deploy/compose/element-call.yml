# Brique element-call — visioconférence standalone (SPA + SFU + appservice).

services:
  # Redis pour le SFU LiveKit.
  call_redis:
    image: redis:5
    networks: [lastarter]

  # SFU LiveKit dédié (pas de port hôte : tout via passerelle wss).
  call_livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--config", "/config.yaml"]
    volumes:
      - ./files/livekit-call.yaml:/config.yaml:ro
    depends_on:
      call_redis:
        condition: service_started
    networks: [lastarter]

  # Service de jetons LiveKit : appservice Synapse.
  # NB : nom avec TIRETS (Synapse rejette les underscores DNS).
  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:0.8.0
    env_file: ["${RUNTIME_DIR}/element-call.env"]
    healthcheck:
      disable: true
    networks: [lastarter]

  # SPA Element Call : standalone + widget.
  element_call:
    image: ghcr.io/element-hq/element-call:latest
    volumes:
      - ${ELEMENT_CALL_CONFIG_PATH:-/dev/null}:/app/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    networks: [lastarter]
