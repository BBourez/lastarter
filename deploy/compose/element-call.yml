# Brique Meet — Element Call + LiveKit SFU + lk-jwt-service.
# Assemblé par `lastarter deploy` (base.yml + meet.yml).
# Versions alignées sur ess-helm (lk-jwt 0.9.0, livekit v1.13.9).

services:
  # Redis pour le SFU LiveKit.
  call_redis:
    image: redis:5
    networks: [lastarter]
    restart: unless-stopped

  # SFU LiveKit dédié (pas de port hôte : tout via passerelle wss).
  call_livekit:
    image: ${LIVEKIT_IMAGE}
    command: ["--config", "/config.yaml"]
    volumes:
      # Montage dossier (les mounts fichier unique renvoient 0 octet sous
      # Docker Desktop Windows) : le CLI écrit livekit-call.yaml rendu.
      - ${MEET_CONFIG_DIR}/livekit-call.yaml:/config.yaml:ro
    depends_on:
      call_redis:
        condition: service_started
    networks: [lastarter]
    restart: unless-stopped

  # Service de jetons LiveKit : appservice Synapse (MSC4512).
  # NB : nom avec TIRETS (Synapse rejette les underscores DNS).
  lk-jwt-service:
    image: ${LK_JWT_IMAGE}
    container_name: ${LASTARTER_CLIENT}-lk-jwt-service
    env_file: ["${RUNTIME_DIR}/element-call.env"]
    networks: [lastarter]
    restart: unless-stopped

  # Point de terminaison federation LOCAL : lk-jwt valide les jetons OpenID
  # via https://<server_name>:8448 (port federation standard). Comme le
  # server_name est un *.localhost non résolvable, ce sidecar partage le
  # namespace réseau de lk-jwt et termine le TLS sur 8448 → Synapse.
  lk_fed_proxy:
    image: nginx:1.27-alpine
    container_name: ${LASTARTER_CLIENT}-lk-fed-proxy
    network_mode: "service:lk-jwt-service"
    volumes:
      # Montage DOSSIER complet (les fichiers uniques renvoient 0 octet sous
      # Docker Desktop Windows) : fed-proxy.conf + server.crt + server.key.
      - ${MEET_CONFIG_DIR}:/fed:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /fed/fed-proxy.conf /etc/nginx/conf.d/default.conf
        exec nginx -g "daemon off;"
    restart: unless-stopped
    depends_on:
      lk-jwt-service:
        condition: service_started

  # SPA Element Call : notre build SSO natif (checkout patche) — le gate
  # oauth2-proxy n'est plus necessaire : le SPA redirige lui-meme vers le SSO
  # Synapse/Keycloak et echange le loginToken (comme Element Web).
  element_call:
    image: ${ELEMENT_CALL_IMAGE}
    container_name: ${LASTARTER_CLIENT}-element-call
    volumes:
      - ${MEET_CONFIG_DIR}:/config-call:ro
    networks: [lastarter]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
