# Brique element-web — client chat (vectorim/element-web:v1.12.30).
# v1.12.x : RoomListStoreV3 avec sections custom, nouvelle UI.
# config.json rendu par le CLI (marque + thème + homeserver) et monté /app/config.json.

services:
  element_web:
    image: vectorim/element-web:v1.12.31
    volumes:
      - ${ELEMENT_CONFIG_PATH}:/app/config.json:ro
    networks: [lastarter]
