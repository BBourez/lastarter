# Brique projects — suivi de projets collaboratif (La Suite numérique).
# App mono-conteneur : frontend React + backend Sails.js sur le port 1337.
# start.sh lance db/init.js (migrations + seed) puis app.js --prod.

services:
  # PostgreSQL pour projects.
  projects_postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projects
      POSTGRES_USER: projects
      POSTGRES_PASSWORD: "${PROJECTS_DB_PASSWORD}"
    volumes:
      - projects_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projects -d projects"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lastarter]

  # App mono-conteneur : frontend + backend sur 1337.
  # Migrations automatiques via start.sh (db/init.js) — rien à faire manuellement.
  projects:
    image: lasuite/projects:latest
    env_file: ["${RUNTIME_DIR}/projects.env"]
    volumes:
      - projects_avatars:/app/public/user-avatars
      - projects_backgrounds:/app/public/project-background-images
      - projects_attachments:/app/private/attachments
    depends_on:
      projects_postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node ./healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [lastarter]

volumes:
  projects_db:
  projects_avatars:
  projects_backgrounds:
  projects_attachments:
