# LaStarter — Drive (stockage de fichiers).
# Images AMONT vanilla : lasuite/drive-backend + lasuite/drive-frontend (v0.25.2),
# pinnées dans catalogue/drive.toml. Infra aux versions du compose amont
# (postgres 16, redis 5, rustfs 1.0.3). Le secret OIDC vient du coffre
# (drive_oidc_secret) — voir catalogue/drive.toml.

services:
  drive_postgresql:
    image: postgres:16
    container_name: ${LASTARTER_CLIENT}-drive-postgresql
    environment:
      POSTGRES_DB: drive
      POSTGRES_USER: dinum
      POSTGRES_PASSWORD: pass
    volumes:
      - drive_pgdata:/var/lib/postgresql/data
    networks: [lastarter]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d drive -U dinum"]
      interval: 5s
      timeout: 3s
      retries: 120

  # redis:5 = version du compose amont drive (BSD — pas de bascule valkey requise).
  drive_redis:
    image: redis:5
    container_name: ${LASTARTER_CLIENT}-drive-redis
    networks: [lastarter]
    restart: unless-stopped

  drive_rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: ${LASTARTER_CLIENT}-drive-rustfs
    environment:
      RUSTFS_ACCESS_KEY: drive
      # Secret via coffre (jeton {secret:drive_s3_secret} du catalogue) : le CLI
      # rend la MÊME valeur dans backend.env (AWS_S3_SECRET_ACCESS_KEY).
      RUSTFS_SECRET_KEY: ${DRIVE_S3_SECRET_KEY}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${DRIVE_ORIGIN}
    volumes:
      - drive_mediadata:/data
    # Alias tiret : aws-cli/botocore rejette les noms d'hôte contenant un
    # tiret bas (Invalid endpoint) — tous les endpoints S3 pointent drive-rustfs.
    networks:
      lastarter:
        aliases: [drive-rustfs]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 20s
      retries: 120

  drive_createbuckets:
    image: amazon/aws-cli
    container_name: ${LASTARTER_CLIENT}-drive-createbuckets
    environment:
      AWS_ACCESS_KEY_ID: drive
      AWS_SECRET_ACCESS_KEY: ${DRIVE_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: eu-east-1
      AWS_ENDPOINT_URL: http://drive-rustfs:9000
    entrypoint: >
      sh -c "
      aws s3 mb s3://drive-media-storage; \
      aws s3api put-bucket-versioning --bucket drive-media-storage --versioning-configuration Status=Enabled && \
      exit 0;"
    networks: [lastarter]
    restart: "no"
    depends_on:
      drive_rustfs:
        condition: service_healthy

  drive_backend:
    image: ${DRIVE_BACKEND_IMAGE}
    container_name: ${LASTARTER_CLIENT}-drive-backend
    env_file: ["${RUNTIME_DIR}/drive/backend.env"]
    environment:
      REQUESTS_CA_BUNDLE: /certs/ca.crt
      # Theming NATIF amont (docs/customization.md) : CSS servi par la passerelle
      # sur /__lastarter/theme.css ; JSON de personnalisation lu au démarrage
      # depuis le dossier .runtime/drive/ (rempli par le CLI).
      FRONTEND_CSS_URL: ${DRIVE_ORIGIN}/__lastarter/theme.css
      THEME_CUSTOMIZATION_FILE_PATH: /config/theme-customization.json
      EMAIL_BRAND_NAME: ${EMAIL_BRAND_NAME:-LaStarter}
    volumes:
      - ${CERTS_DIR}:/certs:ro
      # Dossier complet (les mounts fichier unique renvoient 0 octet sous
      # Docker Desktop Windows) : le CLI écrit theme-customization.json dedans.
      - ${RUNTIME_DIR}/drive:/config:ro
    networks: [lastarter]
    restart: unless-stopped
    depends_on:
      drive_postgresql:
        condition: service_healthy
      drive_rustfs:
        condition: service_healthy

  drive_frontend:
    image: ${DRIVE_FRONTEND_IMAGE}
    container_name: ${LASTARTER_CLIENT}-drive-frontend
    networks: [lastarter]
    restart: unless-stopped
    depends_on:
      drive_backend:
        condition: service_started

volumes:
  drive_pgdata:
  drive_mediadata:
