# Brique drive — fichiers collaboratifs (lasuite/drive-{backend,frontend} v0.24.0).
# Services préfixés drive_* : un seul projet compose fusionné, zéro collision entre briques.
# Infra via env_file de la brique (POSTGRES_*, RUSTFS_*, AWS_* dans catalogue/drive.toml) :
# aucune variable ${} partagée avec les autres briques.

services:
  drive_postgresql:
    image: postgres:16
    env_file: ["${RUNTIME_DIR}/drive.env"]
    volumes:
      - drive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 150
    networks: [lastarter]

  drive_redis:
    image: redis:5
    networks: [lastarter]

  drive_rustfs:
    image: rustfs/rustfs:1.0.0
    env_file: ["${RUNTIME_DIR}/drive.env"]
    ports:
      - "${RUSTFS_PORT:-9000}:9000"   # POC : média servi directement (durcissement phase 6)
    volumes:
      - drive_mediadata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 3s
      timeout: 20s
      retries: 100
    networks: [lastarter]

  drive_createbuckets:
    image: amazon/aws-cli
    env_file: ["${RUNTIME_DIR}/drive.env"]
    environment:
      AWS_ENDPOINT_URL: http://drive_rustfs:9000
    entrypoint: >
      sh -c "
      aws s3api create-bucket --bucket $$AWS_STORAGE_BUCKET_NAME && \
      aws s3api put-bucket-versioning --bucket $$AWS_STORAGE_BUCKET_NAME --versioning-configuration Status=Enabled; \
      exit 0"
    depends_on:
      drive_rustfs:
        condition: service_healthy
    networks: [lastarter]

  drive_app:
    image: lasuite/drive-backend:v0.24.0
    env_file: ["${RUNTIME_DIR}/drive.env"]
    depends_on:
      drive_postgresql:
        condition: service_healthy
      drive_redis:
        condition: service_started
      drive_createbuckets:
        condition: service_completed_successfully
    networks: [lastarter]

  drive_celery:
    image: lasuite/drive-backend:v0.24.0
    command: ["celery", "-A", "drive.celery_app", "worker", "-l", "INFO"]
    env_file: ["${RUNTIME_DIR}/drive.env"]
    depends_on:
      drive_app:
        condition: service_started
    networks: [lastarter]

  drive_frontend:
    image: lasuite/drive-frontend:v0.24.0
    networks: [lastarter]

volumes:
  drive_pgdata:
  drive_mediadata:
