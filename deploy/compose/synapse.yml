# Brique synapse — homeserver Matrix (matrixdotorg/synapse:v1.162.0).
# homeserver.yaml + clé de signature rendus par le CLI (as-code, secrets substitués).

services:
  synapse_postgresql:
    image: postgres:16
    env_file: ["${RUNTIME_DIR}/synapse.env"]
    environment:
      # Synapse exige la collation C (docs/postgres.md amont) — fixe à l'initdb.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 150
    networks: [lastarter]

  synapse_synapse:
    image: matrixdotorg/synapse:v1.162.0
    volumes:
      - synapse_data:/data
      # Rendus par le CLI (.runtime/) — jamais commités.
      - ${SYNAPSE_HOMESERVER_PATH}:/data/homeserver.yaml:ro
      - ${SYNAPSE_SIGNING_KEY_PATH}:/data/keys/signing.key:ro
      - ${LK_REGISTRATION_PATH}:/data/appservices/lk-jwt-service.yaml:ro
    depends_on:
      synapse_postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || wget -q -O- http://localhost:8008/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 25s
    networks: [lastarter]

volumes:
  synapse_pgdata:
  synapse_data:
