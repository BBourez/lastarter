# Brique discussions — Element Web + Synapse sur chat.<domaine>.
# Assemblé par `lastarter deploy` (base.yml + discussions.yml).
# Montage par DOSSIER (.runtime/discussions/) : les mounts fichier unique
# renvoient 0 octet sous Docker Desktop Windows (leçon POC).

services:
  discussions_synapse:
    image: ${SYNAPSE_IMAGE}
    container_name: ${LASTARTER_CLIENT}-discussions-synapse
    # CA locale dans le magasin système (le client OIDC de Synapse ignore
    # SSL_CERT_FILE) + pinnage IPv4 de la passerelle dans /etc/hosts :
    # RFC 6761 renvoie *.localhost vers 127.0.0.1 et host-gateway IPv6
    # fait timeouter Twisted — les deux leçons du POC.
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        update-ca-certificates 2>/dev/null || true
        PROXY_IP=$$(getent hosts ${LASTARTER_GATEWAY_SERVICE} | awk '{print $$1; exit}')
        if [ -n "$$PROXY_IP" ]; then
          echo "$$PROXY_IP ${LASTARTER_HOST} id.${LASTARTER_HOST} chat.${LASTARTER_HOST}" >> /etc/hosts
        fi
        chown -R 991:991 /data
        exec gosu 991:991 /start.py run
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      SSL_CERT_FILE: /config/ca.crt
      REQUESTS_CA_BUNDLE: /config/ca.crt
    volumes:
      - discussions_data:/data
      - ${DISCUSSIONS_CONFIG_DIR}:/config:ro
    networks: [lastarter]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15s

  discussions_element_web:
    image: ${ELEMENT_WEB_IMAGE}
    container_name: ${LASTARTER_CLIENT}-discussions-element-web
    user: root
    # config.json copié en root depuis le montage dossier (robuste Windows),
    # puis nginx démarre (master root, workers nginx — usage standard).
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /config-element/config.json /app/config.json
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    volumes:
      - ${DISCUSSIONS_CONFIG_DIR}:/config-element:ro
    networks: [lastarter]
    restart: unless-stopped

volumes:
  discussions_data:
