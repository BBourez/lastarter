# LiveKit pour la brique meet — POC local (mono-nœud, TURN désactivé).
# Adapté de examples-inspiration/meet/docker/livekit/config/livekit-server.yaml.
# ⚠️ Clés dev de l'amont : doivent correspondre à LIVEKIT_API_KEY/SECRET du
# catalogue meet.toml (durcissement phase 6 : clés du coffre + config rendue).
log_level: info
redis:
  address: meet_redis:6379
keys:
  devkey: secret

webhook:
  api_key: devkey
  urls:
    - http://meet_app:8000/api/v1.0/rooms/webhooks-livekit/

rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false
