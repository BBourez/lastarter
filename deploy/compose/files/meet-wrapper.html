<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>LaStarter Meet</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1e1b4b, #4f46e5); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p id="status">Connexion&hellip;</p>
  </div>
  <script>
    (function() {
      var MEET = window.location.origin;
      var MATRIX = MEET.replace("meet.", "matrix.");
      var params = new URLSearchParams(window.location.search);
      var loginToken = params.get("loginToken");

      // PHASE 1: /authed?loginToken=xxx — échanger le token
      if (window.location.pathname === "/authed" && loginToken) {
        document.getElementById("status").textContent = "Authentification…";
        fetch(MEET + "/_matrix/client/v3/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "m.login.token", token: loginToken })
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.access_token) {
            localStorage.setItem("ls_access_token", data.access_token);
            localStorage.setItem("ls_user_id", data.user_id || "");
            window.location.href = MEET + "/app";
          } else {
            document.getElementById("status").textContent = "Erreur: " + (data.error || "token invalide");
          }
        }).catch(function(e) {
          document.getElementById("status").textContent = "Erreur réseau";
        });
        return;
      }

      // PHASE 2: /app — vérifier le token puis charger element-call
      if (window.location.pathname === "/app") {
        var token = localStorage.getItem("ls_access_token");
        if (!token) { window.location.href = MEET; return; }
        fetch(MEET + "/_matrix/client/v3/account/whoami", {
          headers: { "Authorization": "Bearer " + token }
        }).then(function(r) {
          if (r.ok) { loadElementCall(); }
          else { localStorage.removeItem("ls_access_token"); window.location.href = MEET; }
        }).catch(function() { window.location.href = MEET; });
        return;
      }

      // PHASE 0: / — pas connecté → SSO direct vers matrix (cookie sur le bon domaine)
      var existing = localStorage.getItem("ls_access_token");
      if (existing) {
        fetch(MEET + "/_matrix/client/v3/account/whoami", {
          headers: { "Authorization": "Bearer " + existing }
        }).then(function(r) {
          if (r.ok) { window.location.href = MEET + "/app"; }
          else { goToSSO(); }
        }).catch(goToSSO);
      } else {
        goToSSO();
      }

      function goToSSO() {
        // IMPORTANT : le SSO doit démarrer sur matrix.<domaine> pour que le cookie
        // de session soit posé sur le MÊME domaine que le callback OIDC.
        var redirect = encodeURIComponent(MEET + "/authed");
        window.location.href = MATRIX + "/_matrix/client/v3/login/sso/redirect?redirectUrl=" + redirect;
      }

      function loadElementCall() {
        fetch(MEET + "/element-call-index.html")
          .then(function(r) { return r.text(); })
          .then(function(html) {
            document.open();
            document.write(html);
            document.close();
          });
      }
    })();
  </script>
</body>
</html>
