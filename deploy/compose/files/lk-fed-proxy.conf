# Endpoint federation local pour lk-jwt-service (netns partagé).
# lk-jwt valide les jetons OpenID via https://<server_name>:8448 —
# ce proxy termine le TLS (cert SAN *.localhost) et proxifie vers Synapse.
server {
    listen 8448 ssl;
    server_name _;

    ssl_certificate /fed/server.crt;
    ssl_certificate_key /fed/server.key;

    location / {
        proxy_pass http://discussions_synapse:8008;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
