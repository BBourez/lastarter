# Garage (S3) pour la brique meet — mono-nœud, POC.
# Adapté de examples-inspiration/meet/docker/files/etc/garage/garage.toml.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

# POC : secret RPC fixe (l'amont le fournit par GARAGE_RPC_SECRET) — phase 6 : coffre.
# Garage exige 32 octets en hex (64 caractères).
rpc_secret = "1a5f7c3b9e2d4f6a8c0b3d5e7f9a1c2e4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a"

rpc_bind_addr = "0.0.0.0:3901"

[s3_api]
api_bind_addr = "[::]:9000"
s3_region = "local"
