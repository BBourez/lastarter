# LaStarter — edge nginx mono-domaine pour la brique drive.
# /            → frontend (export statique Next.js)
# /api/        → backend Django (gunicorn)
# /realms/ /resources/ /js/ /admin/ → Keycloak (SSO)
server {
    listen 8083;
    server_name _;
    charset utf-8;
    server_tokens off;

    client_max_body_size 150m;

    # API backend
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak (auth SSO + console admin en POC)
    location /realms/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
    }
    location /js/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
    }
    location /admin/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
    }

    # Frontend statique
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }
}
