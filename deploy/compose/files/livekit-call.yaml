# LiveKit dédié à element-call — POC (mono-nœud, TURN désactivé).
# Clés dev de l'amont : doivent correspondre à LIVEKIT_KEY/SECRET du catalogue.
log_level: info
redis:
  address: call_redis:6379
keys:
  devkey: secret

webhook:
  api_key: devkey
  urls:
    - http://lk_jwt_service:6080/livekit/webhook

rtc:
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: false
