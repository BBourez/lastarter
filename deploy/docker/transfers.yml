# LaStarter Transfers : backend Django + frontend Vite.
# Active via MODULE_TRANSFERS=true dans .env

services:
  transfers_postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: ${TRANSFERS_DB_PASSWORD}
    volumes:
      - transfers_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfers"]
      interval: 5s
      timeout: 3s
      retries: 100
    networks: [lastarter]

  transfers_backend:
    image: ghcr.io/suitenumerique/transfers-backend:latest
    env_file: [.env]
    depends_on:
      transfers_postgresql:
        condition: service_healthy
    networks: [lastarter]

  transfers_frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/transfers-frontend.Dockerfile
    depends_on:
      transfers_backend:
        condition: service_started
    networks: [lastarter]

volumes:
  transfers_pgdata:
