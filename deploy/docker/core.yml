# LaStarter Core : Keycloak SSO + Gateway TLS + Portal.
# Base obligatoire pour tous les deploiements.

services:
  kc_postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - kc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 100
    networks: [lastarter]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc_postgresql:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: id.${LASTARTER_DOMAIN}
      KC_HOSTNAME_STRICT_HTTPS: false
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ../../identity/realm:/opt/keycloak/data/import
      - ../../identity/keycloak-theme:/opt/keycloak/themes/lastarter
    depends_on:
      kc_postgresql:
        condition: service_healthy
    networks: [lastarter]

  portal:
    build:
      context: ../..
      dockerfile: deploy/docker/portal.Dockerfile
    networks: [lastarter]

  gateway:
    image: nginx:1.25-alpine
    ports:
      - "8443:8443"
    volumes:
      - ${EDGE_CONF_PATH:-./edge.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      keycloak:
        condition: service_started
      portal:
        condition: service_started
    networks: [lastarter]

volumes:
  kc_pgdata:

networks:
  lastarter:
    driver: bridge
