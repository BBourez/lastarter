{{- /*
LaStarter : deployment PostgreSQL Keycloak
*/ -}}
{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-keycloak-db
  labels:
    app: {{ .Release.Name }}-keycloak-db
spec:
  serviceName: {{ .Release.Name }}-keycloak-db
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-keycloak-db
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-keycloak-db
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.keycloakDb.image }}
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: keycloak-db-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.keycloakDb.storageClass }}
        storageClassName: {{ .Values.keycloakDb.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.keycloakDb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak-db
spec:
  selector:
    app: {{ .Release.Name }}-keycloak-db
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
