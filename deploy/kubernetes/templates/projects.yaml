{{- /*
LaStarter : deployment Projects (backend Sails.js + frontend)
*/ -}}
{{- if .Values.projects.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-projects-backend
  labels:
    app: {{ .Release.Name }}-projects-backend
spec:
  replicas: {{ .Values.projects.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-projects-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-projects-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.projects.backendImage }}
          env:
            - name: BASE_URL
              value: https://projects.{{ .Values.domain }}
            - name: OIDC_ISSUER
              value: https://id.{{ .Values.domain }}/realms/lastarter
          ports:
            - containerPort: 1337
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/config
              port: 1337
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-projects-backend
spec:
  selector:
    app: {{ .Release.Name }}-projects-backend
  ports:
    - port: 1337
      targetPort: 1337
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-projects-frontend
  labels:
    app: {{ .Release.Name }}-projects-frontend
spec:
  replicas: {{ .Values.projects.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-projects-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-projects-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.projects.frontendImage }}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-projects-frontend
spec:
  selector:
    app: {{ .Release.Name }}-projects-frontend
  ports:
    - port: 80
      targetPort: 80
{{- end }}
