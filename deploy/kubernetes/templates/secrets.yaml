{{- /*
LaStarter : secret Kubernetes pour tous les mots de passe
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  keycloak-db-password: {{ .Values.keycloak.dbPassword | quote }}
  keycloak-admin-password: {{ .Values.keycloak.adminPassword | quote }}
  {{- if .Values.transfers.enabled }}
  transfers-db-password: {{ .Values.transfers.dbPassword | quote }}
  {{- end }}
