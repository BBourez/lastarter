{{- /*
LaStarter : deployment Portal (point d'entree)
*/ -}}
{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  labels:
    app: {{ .Release.Name }}-portal
spec:
  replicas: {{ .Values.portal.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-portal
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-portal
    spec:
      containers:
        - name: portal
          image: {{ .Values.portal.image }}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal
spec:
  selector:
    app: {{ .Release.Name }}-portal
  ports:
    - port: 80
      targetPort: 80
{{- end }}
