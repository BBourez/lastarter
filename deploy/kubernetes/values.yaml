# LaStarter Helm Chart : configuration par defaut

# Domaine principal (requis)
domain: ""

# Scheme
scheme: https

# Branding
brand:
  name: LaStarter
  color: "#0bc491"

# Keycloak (SSO)
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.0
  adminPassword: ""
  dbPassword: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# PostgreSQL (Keycloak)
keycloakDb:
  image: postgres:16-alpine
  storage: 5Gi
  storageClass: ""

# Portail
portal:
  enabled: true
  image: lastarter/portal:latest
  replicas: 1

# Passerelle (nginx)
gateway:
  enabled: true
  image: nginx:1.25-alpine
  tlsSecret: ""  # Nom du secret Kubernetes contenant les certificats TLS

# Module : Transfers
transfers:
  enabled: false
  backendImage: ghcr.io/suitenumerique/transfers-backend:latest
  frontendImage: lastarter/transfers-frontend:latest
  dbPassword: ""
  replicas: 1

# Module : Projects
projects:
  enabled: false
  backendImage: lasuite/projects:latest
  frontendImage: lastarter/projects-frontend:latest
  replicas: 1

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls: true
