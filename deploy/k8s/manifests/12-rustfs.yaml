# LaStarter kind — RustFS 1.0.3 (S3 local, images pinnées ; PVC pour /data).
# Service « rustfs » : alias DNS SANS underscore (aws-cli/botocore les rejettent).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: lastarter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: lastarter
  labels:
    app.kubernetes.io/part-of: lastarter
    app.kubernetes.io/component: infra-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.3
          env:
            - name: RUSTFS_ACCESS_KEY
              value: drive
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: drive-secrets
                  key: RUSTFS_SECRET_KEY
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: http://drive.localhost:8080
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: lastarter
  labels:
    app: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
