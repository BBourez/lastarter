# Brique : Chat — client element-web (UX Element native, recolorée par config, zéro fork).
# config.json rendu par le CLI depuis identity/element-config.json + la palette du
# manifeste ([branding.custom_theme]) — docs/theming.md amont.

[brick]
name = "element-web"
title = "Chat — messagerie chiffrée (element-web)"
category = "communication"
description = "Messagerie Matrix chiffrée de bout en bout, salons et espaces — UI Element native aux couleurs LaStarter."
license = "AGPL-3.0 OR GPL-3.0 OR Element-Commercial"   # multilicence : LaStarter choisit AGPL-3.0
upstream_repo = "https://github.com/element-hq/element-web"
upstream_pin = "v1.12.31"
requires = ["synapse"]

[oidc]
# Auth via SSO Synapse (délégué au realm) — pas de client OIDC direct ici.
client_id = ""

[branding.env]
BRAND = "{brand_name}"

[branding.custom_theme]
# Injecté dans setting_defaults.custom_themes[0] du config.json rendu.
name = "LaStarter Light"
is_dark = false
accent-color = "#4F46E5"
primary-color = "#4F46E5"
warning-color = "#E11D48"
sidebar-color = "#1E1B4B"
roomlist-background-color = "#F5F5FF"
roomlist-text-color = "#1E1B4B"
roomlist-text-secondary-color = "#61708B"
roomlist-highlights-color = "#FFFFFF"
roomlist-separator-color = "#E0E7FF"
timeline-background-color = "#FFFFFF"
timeline-text-color = "#1E1B4B"
timeline-text-secondary-color = "#61708B"
timeline-highlights-color = "#F5F5FF"

[env]
# App statique : la seule « config » est le config.json monté (rendu CLI).
ELEMENT_CONFIG = "rendu par lastarter deploy (.runtime/element-config.json)"

[compose]
profile = "chat"
infra_services = []
migrate_service = ""
recreate_service = "element_web"   # config.json monté : recreation au changement
route_label = "chat"            # chat.<domaine> → client web
frontend_target = "element_web:80"
# pas d'api_target : le client parle directement au homeserver (matrix.<domaine>)
s3_public_port = "9000"
extra_servers = []
services = ["element_web"]      # vectorim/element-web:v1.11.102
extras = ["element_call"]       # widget visio intra-chat (phase 6)

[notes]
warnings = "Ne JAMAIS forker pour le branding — custom_themes + branding.* couvrent tout (docs/theming.md). Version non modifiée = conformité AGPL par mention source (SOURCES.md)."
