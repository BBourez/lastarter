# Brique : Synapse — homeserver Matrix (le serveur du chat). Remplace ess-helm.
# homeserver.yaml rendu as-code par le CLI (rendu depuis identity/homeserver-synapse.yaml).
# OIDC : endpoints scindés (auth/logout → public via passerelle ; token/userinfo/jwks →
# in-network keycloak:8080) car l'issuer Keycloak est public — pattern vérifié amont.

[brick]
name = "synapse"
title = "Synapse — serveur Matrix"
category = "communication"
description = "Homeserver Matrix : salons chiffrés E2E, SSO délégué au realm LaStarter."
license = "AGPL-3.0-only"
upstream_repo = "https://github.com/element-hq/synapse"
upstream_image = "matrixdotorg/synapse:v1.162.0"
upstream_pin = "v1.162.0"
requires = ["keycloak"]
# Secrets à formats spéciaux : *_b64 = base64 standard de 32 octets (clé ed25519
# de signature serveur — le seed EST la clé privée, cf. format signedjson).
extra_secrets = [
  "synapse_signing_key:b64",
  "synapse_macaroon",
  "synapse_registration",
  "synapse_form",
  "synapse_oidc_secret",
  "synapse_db_password",
  # Appservice rtc/livekit (fichier registration monté en permanence).
  "lk_as_token",
  "lk_hs_token",
]

[oidc]
# Le client OIDC `synapse` est provisionné comme les autres briques : le secret
# ci-dessous alimente à la fois le realm (via l'env rendu) et le homeserver.
client_id = "synapse"
scopes = "openid email profile"

[branding.env]
# Le branding visible vit côté client (element-web) ; Synapse sert l'API.

[env]
# DB (conteneur synapse_postgresql, via env_file)
POSTGRES_DB = "synapse"
POSTGRES_USER = "synapse"
POSTGRES_PASSWORD = "{secret:synapse_db_password}"

# Ces deux variables ne servent qu'au provisionnement du realm (build_realm_clients) :
OIDC_RP_CLIENT_ID = "synapse"
OIDC_RP_CLIENT_SECRET = "{secret:synapse_oidc_secret}"

[compose]
profile = "chat"
infra_services = ["synapse_postgresql"]
migrate_service = ""            # synapse crée son schéma au premier démarrage
# One-off root avant démarrage : l'image tourne en UID 991, le volume /data est root.
prepare_service = "synapse_synapse"
prepare_command = "mkdir -p /data/media && chown 991:991 /data /data/media"
prepare_user = "0:0"
route_label = "matrix"          # matrix.<domaine> : API client + SSO callback
frontend_target = "synapse_synapse:8008"
api_target = "synapse_synapse:8008"
portal_visible = "false"        # backend du chat : pas de tuile portail
s3_public_port = "9000"
extra_servers = []
services = [
  "synapse_synapse",       # matrixdotorg/synapse:v1.162.0
  "synapse_postgresql",    # postgres:16
]
extras = ["element_call", "lk-jwt-service"]   # appels chiffrés intra-chat (phase 6)

[notes]
warnings = "Fédération désactivée par défaut (trusted_key_servers vide, B2B privé). L'activation (phase 6) exige le .well-known/matrix sur l'apex + ports 8448."
