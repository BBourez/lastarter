# Brique : Meet — visioconférence (La Suite Meet, MIT).
# Env production canonique : env.d/production.dist/common amont.
# Images publiées : lasuite/meet-backend / meet-frontend (Docker Hub).

[brick]
name = "meet"
title = "Meet — visioconférence"
category = "collaboration"
description = "Réunions en ligne haute qualité (LiveKit), partage d'écran, enregistrement (option)."
license = "MIT"
upstream_repo = "https://github.com/suitenumerique/meet"
upstream_pin = "v1.35.0"
requires = ["keycloak"]

[oidc]
client_id = "meet"
scopes = "openid email"

[branding.env]
DJANGO_EMAIL_BRAND_NAME = "{brand_name}"

[env]
# Production/Feature attendent ALLOWED_HOSTS sans préfixe DJANGO_ (settings amont) ;
# en local (http), Development évite SECURE_SSL_REDIRECT=True qui bouclerait en https.
DJANGO_CONFIGURATION = "{django_configuration}"
ALLOWED_HOSTS = "{app_bare}"
DJANGO_ALLOWED_HOSTS = "{app_bare}"  # django-configurations préfixe malgré environ_name (vérifié en réel)
DJANGO_SECRET_KEY = "{secret:meet_django_secret_key}"
DJANGO_SETTINGS_MODULE = "meet.settings"
DJANGO_CSRF_TRUSTED_ORIGINS = "{origin}"
MEET_BASE_URL = "{origin}"
ALLOW_UNREGISTERED_ROOMS = "False"
LOGGING_LEVEL_LOGGERS_ROOT = "INFO"
LOGGING_LEVEL_LOGGERS_APP = "INFO"

# Base de données applicative
DB_HOST = "meet_postgresql"
DB_NAME = "meet"
DB_USER = "meet"
DB_PASSWORD = "{secret:meet_db_password}"
DB_PORT = "5432"
POSTGRES_DB = "meet"
POSTGRES_USER = "meet"
POSTGRES_PASSWORD = "{secret:meet_db_password}"

# Cache / files (redis interne)
REDIS_URL = "redis://meet_redis:6379/0"
CELERY_BROKER_URL = "redis://meet_redis:6379/0"

# Stockage objet Garage (média des salons)
AWS_S3_ENDPOINT_URL = "http://meet_garage:9000"
AWS_S3_ACCESS_KEY_ID = "meet-access-key"
AWS_S3_SECRET_ACCESS_KEY = "{secret:meet_s3_secret_key}"
AWS_S3_REGION_NAME = "local"
AWS_S3_SIGNATURE_VERSION = "s3v4"
AWS_S3_DOMAIN_REPLACE = "https://{domain_s3}"
AWS_STORAGE_BUCKET_NAME = "meet-media-storage"
GARAGE_DEFAULT_ACCESS_KEY = "meet-access-key"
GARAGE_DEFAULT_SECRET_KEY = "{secret:meet_s3_secret_key}"
GARAGE_DEFAULT_BUCKET = "meet-media-storage"

# LiveKit (SFU) — POC : clés dev de l'amont (durcissement phase 6 : coffre + config rendue).
# URL publique via passerelle (ws://livekit.<domaine>) ; le backend l'atteint par
# extra_hosts (host-gateway) — même URL pour le navigateur et le backend.
LIVEKIT_API_KEY = "devkey"
LIVEKIT_API_SECRET = "secret"
LIVEKIT_API_URL = "{ws}://livekit.{domain}"

# SSO Keycloak — realm `lastarter` sur l'apex
OIDC_OP_JWKS_ENDPOINT = "http://keycloak:8080/realms/lastarter/protocol/openid-connect/certs"
OIDC_OP_AUTHORIZATION_ENDPOINT = "{sso_origin}/realms/lastarter/protocol/openid-connect/auth"
OIDC_OP_TOKEN_ENDPOINT = "http://keycloak:8080/realms/lastarter/protocol/openid-connect/token"
OIDC_OP_USER_ENDPOINT = "http://keycloak:8080/realms/lastarter/protocol/openid-connect/userinfo"
OIDC_OP_LOGOUT_ENDPOINT = "{sso_origin}/realms/lastarter/protocol/openid-connect/logout"
OIDC_RP_CLIENT_ID = "meet"
OIDC_RP_CLIENT_SECRET = "{secret:meet_oidc_client_secret}"
OIDC_RP_SIGN_ALGO = "RS256"
OIDC_RP_SCOPES = "openid email"
LOGIN_REDIRECT_URL = "{origin}"
LOGIN_REDIRECT_URL_FAILURE = "{origin}"
LOGOUT_REDIRECT_URL = "{origin}"

[compose]
profile = "meet"
# Orchestration pilotée par le CLI (cf. SCHEMA.md) :
# jobs one-shot exclus (démarrés via depends_on de l'app, service_completed_successfully)
infra_services = [
  "meet_postgresql",
  "meet_redis",
  "meet_garage",
  "meet_livekit",
]
migrate_service = "meet_app"
migrate_command = "python manage.py migrate --no-input"
# Exposition passerelle :
route_label = "meet"
frontend_target = "meet_frontend:8080"
api_target = "meet_app:8000"
extra_servers = [
  { label = "livekit", target = "meet_livekit:7880" },      # websocket SFU (wss)
  { label = "meet-media", target = "meet_garage:9000" },    # S3 média via passerelle
]
services = [
  "meet_app",          # lasuite/meet-backend — gunicorn
  "meet_frontend",     # lasuite/meet-frontend — statique nginx:8080
  "meet_celery",       # worker
  "meet_postgresql",   # postgres:16
  "meet_redis",        # redis:5 (partagé backend + livekit)
  "meet_garage",       # dxflrs/garage:v2.4.1 — S3 média
  "meet_garage_cors",  # job aws-cli : CORS pour le frontend
  "meet_livekit",      # livekit/livekit-server:v1.13.6 — SFU
]
extras = ["meet_livekit_egress"]   # enregistrement (livekit/egress)

[notes]
warnings = "LiveKit POC : clés dev amont (devkey/secret) et TURN désactivé (config files/livekit-meet.yaml) — durcissement phase 6. L'enregistrement (egress) est optionnel."
