# Brique : Drive — stockage et édition collaborative de fichiers.
# Ancré sur le compose amont (examples-inspiration/drive/compose.yaml) et
# env.d/development/common (noms de variables vérifiés).

[brick]
name = "drive"
title = "Drive — fichiers collaboratifs"
category = "collaboration"
description = "Stockage, partage granulaire, prévisualisation et édition en ligne (WOPI : Collabora/OnlyOffice)."
license = "MIT"
upstream_repo = "https://github.com/suitenumerique/drive"
upstream_pin = "checkout examples-inspiration/drive (à épingler par tag en phase 2)"
requires = ["keycloak"]

[oidc]
client_id = "drive"
scopes = "openid email"

[branding.env]
# Marque blanche sans patch de code — variables vérifiées dans env.d/development/common.
FRONTEND_THEME = "dsfr-light"
DJANGO_EMAIL_BRAND_NAME = "{brand_name}"
DJANGO_EMAIL_LOGO_IMG = "https://{domain}/assets/logo.png"
DJANGO_EMAIL_URL_APP = "https://{domain}"
FRONTEND_HELP_MENU_CONFIG = "{}"
FRONTEND_FEEDBACK_BUTTON_SHOW = "False"

[env]
DJANGO_ALLOWED_HOSTS = "{domain}"
DJANGO_SECRET_KEY = "{secret:django_secret_key}"
DJANGO_SETTINGS_MODULE = "drive.settings"
AWS_S3_ACCESS_KEY_ID = "drive"
AWS_S3_SECRET_ACCESS_KEY = "{secret:s3_secret_key}"
AWS_S3_REGION_NAME = "eu-east-1"
AWS_S3_ENDPOINT_URL = "http://rustfs:9000"
AWS_S3_DOMAIN_REPLACE = "https://{domain}"
OIDC_OP_AUTHORIZATION_ENDPOINT = "https://{domain}/realms/lastarter/protocol/openid-connect/auth"
OIDC_OP_TOKEN_ENDPOINT = "https://{domain}/realms/lastarter/protocol/openid-connect/token"
OIDC_OP_USER_ENDPOINT = "https://{domain}/realms/lastarter/protocol/openid-connect/userinfo"
OIDC_OP_JWKS_ENDPOINT = "http://keycloak:8080/realms/lastarter/protocol/openid-connect/certs"
OIDC_RP_CLIENT_ID = "drive"
OIDC_RP_CLIENT_SECRET = "{secret:oidc_client_secret}"
OIDC_RP_SIGN_ALGO = "RS256"
OIDC_RP_SCOPES = "openid email"
LOGIN_REDIRECT_URL = "https://{domain}"
LOGOUT_REDIRECT_URL = "https://{domain}"
WOPI_CLIENTS = "collabora"

[compose]
profile = "drive"
services = [
  "app",             # backend Django (build amont)
  "frontend",        # Next.js (build amont)
  "celery",          # worker (même image que app)
  "postgresql",      # postgres:16, DB applicative
  "redis",           # redis:5
  "rustfs",          # rustfs/rustfs:1.0.0 — S3 compatible (média)
  "createbuckets",   # job aws-cli : crée le bucket média versionné
  "nginx",           # reverse proxy front+api+keycloak (modèle amont)
]
extras = [
  "collabora",       # éditeur WOPI (collabora/code:26.04.2.2.1)
  "onlyoffice",      # éditeur WOPI alternatif (documentserver-de)
  "ds-proxy",        # proxy S3 chiffré (option sécurité renforcée)
]

[notes]
warnings = "Editeur WOPI : activer collabora OU onlyoffice (pas les deux par défaut). Le bucket média est créé par le job createbuckets au premier démarrage."
