# Brique : Element Call — visioconférence standalone (remplace meet).
# SPA + LiveKit SFU + lk-jwt-service : tout est autonome.
# Mode standalone : accès direct pour créer/rejoindre des appels.
# Mode widget : intégré dans les salons du chat (element-web).

[brick]
name = "element-call"
title = "Meet — visioconférence"
category = "collaboration"
description = "Réunions en ligne chiffrées : créez un appel, partagez le lien, rejoignez depuis le navigateur."
license = "AGPL-3.0-only"
upstream_repo = "https://github.com/element-hq/element-call"
upstream_image = "ghcr.io/element-hq/element-call"
upstream_pin = "latest"
requires = ["synapse"]

[oidc]
client_id = ""

[branding.env]

[env]
# --- LiveKit SFU dédié ---
LIVEKIT_KEY = "devkey"
LIVEKIT_SECRET = "secret"

# --- lk-jwt-service (appservice Synapse) ---
LIVEKIT_AS_TOKEN = "{secret:lk_as_token}"
LIVEKIT_HS_TOKEN = "{secret:lk_hs_token}"
LIVEKIT_JWT_BIND = "0.0.0.0:6080"
LIVEKIT_URL = "{ws}://livekit.{domain}"
LIVEKIT_HS_SERVER_NAME = "{domain_bare}"
LIVEKIT_CS_API_URL_OVERRIDES = "{domain_bare}=http://synapse_synapse:8008"
LIVEKIT_FULL_ACCESS_HOMESERVERS = "*"

[compose]
profile = "chat"
infra_services = ["call_livekit", "call_redis"]
migrate_service = ""
recreate_service = "element_call"
route_label = "meet"            # meet.<domaine> → visio standalone element-call
frontend_target = "element_call:8080"
api_target = ""
extra_servers = [
  { label = "livekit", target = "call_livekit:7880" },
]
services = [
  "element_call",      # SPA standalone + widget
  "lk-jwt-service",    # appservice Synapse MSC4512
  "call_livekit",      # SFU LiveKit dédié
  "call_redis",        # Redis pour LiveKit
]
extras = []

extra_secrets = ["lk_as_token", "lk_hs_token"]

[notes]
warnings = "LiveKit POC : clés devkey/secret (phase 6 : coffre). MSC3266/4143/4222 requis dans Synapse (activés dans le homeserver template)."
