# Thème LaStarter « element-light » — palette Compound (Element Web / Element Call).
# Source : @vector-im/compound-design-tokens, thème light.
# Ce fichier est le format d'entrée du CLI (rendu vers theme.css à l'installation).

[theme]
name = "element-light"
label = "Element (clair)"
dark = false
# Fond de page (canvas) et police par défaut.
canvas = "#ffffff"
font_family = "Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
font_mono = "Inconsolata, ui-monospace, monospace"

# Échelle PRIMAIRE (vert Element) — remplace « brand » Cunningham (violet).
# Boutons, liens, accents, logo des apps La Suite.
[palette.primary]
50 = "#f8fdfb"
100 = "#f8fdfb"
150 = "#f1fbf6"
200 = "#f1fbf6"
250 = "#e3f7ed"
300 = "#e3f7ed"
350 = "#c6eedb"
400 = "#c6eedb"
450 = "#98e1c1"
500 = "#98e1c1"
550 = "#71d7ae"
600 = "#71d7ae"
650 = "#0bc491"
700 = "#0bc491"
750 = "#009b78"
800 = "#009b78"
850 = "#007a61"
900 = "#007a61"
950 = "#006b52"

