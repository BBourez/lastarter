# LaStarter CI : lint + tests + typecheck sur chaque push/PR.
# pnpm version vient du packageManager dans package.json (pas de doublon).
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm lint

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --no-frozen-lockfile
            - run: cd packages/ui && npx vitest run
            - run: cd packages/api && npx vitest run

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm -r --filter './packages/*' exec tsc --noEmit || true
