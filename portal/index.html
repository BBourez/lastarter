<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LaStarter</title>
  <link rel="stylesheet" href="/__lastarter/theme.css" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-brand">
          <span class="brand-mark" id="brand-logo" aria-hidden="true"></span>
          <span class="brand-text" id="brand">LaStarter</span>
        </div>
        <nav class="topbar-nav" id="nav">
          <!-- Items générés -->
        </nav>
        <div class="topbar-actions">
          <a class="btn-pill" id="login" href="#">Se connecter</a>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <h1 class="hero-title" id="tagline">La suite collaborative de votre organisation.</h1>
        <p class="hero-sub">Un seul compte, toutes vos applications.</p>
      </section>

      <section class="apps" id="apps" aria-label="Applications">
        <!-- Tuiles générées -->
      </section>

      <footer class="footer">
        <span id="footer-brand">LaStarter</span> · <a href="/sources.html">Mentions &amp; sources</a>
      </footer>
    </main>
  </div>

  <script>
    fetch("/portal-config.json", { cache: "no-cache" })
      .then((r) => r.json())
      .then((cfg) => {
        document.title = cfg.brand;
        document.getElementById("brand").textContent = cfg.brand;
        document.getElementById("footer-brand").textContent = cfg.brand;
        if (cfg.tagline) document.getElementById("tagline").textContent = cfg.tagline;
        document.getElementById("login").href = cfg.account_url;

        const logo = getComputedStyle(document.documentElement)
          .getPropertyValue("--lastarter-logo-url").trim();
        if (logo && logo !== 'url("")' && logo !== "none") {
          document.getElementById("brand-logo").style.backgroundImage = logo;
        }

        const nav = document.getElementById("nav");
        const apps = document.getElementById("apps");
        for (const app of cfg.apps) {
          const n = document.createElement("a");
          n.className = "nav-link";
          n.href = app.url;
          n.textContent = app.name;
          nav.appendChild(n);

          const a = document.createElement("a");
          a.className = "app-tile";
          a.href = app.url;
          a.innerHTML =
            '<span class="tile-glyph" aria-hidden="true">' + (app.emoji || "◆") + "</span>" +
            '<span class="tile-info">' +
              '<span class="tile-title">' + app.name + "</span>" +
              '<span class="tile-sub">' + (app.description || "") + "</span>" +
            "</span>" +
            '<span class="tile-arrow" aria-hidden="true">→</span>';
          apps.appendChild(a);
        }
        if (!cfg.apps.length) {
          apps.innerHTML = '<p class="empty">Aucune application activée.</p>';
        }
      })
      .catch(() => {
        document.getElementById("apps").innerHTML =
          '<p class="empty">Configuration indisponible.</p>';
      });
  </script>
</body>
</html>
