<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LaStarter</title>
  <link rel="stylesheet" href="/__lastarter/theme.css" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-row">
        <span class="brand-logo" id="brand-logo" aria-hidden="true"></span>
        <div class="brand" id="brand">LaStarter</div>
      </div>
      <p class="tagline" id="tagline">La suite collaborative de votre organisation.</p>
      <div class="session">
        <a class="btn primary" id="login" href="#">Se connecter</a>
      </div>
    </header>

    <section class="grid" id="apps" aria-label="Applications disponibles">
      <!-- Tuiles générées depuis /portal-config.json -->
    </section>

    <footer class="foot">
      <span id="footer-brand">LaStarter</span> — hébergement souverain.
      <a href="/sources.html">Mentions &amp; sources</a>
    </footer>
  </main>

  <script>
    // Portail LaStarter — statique, zéro dépendance, configuré par le CLI.
    fetch("/portal-config.json")
      .then((r) => r.json())
      .then((cfg) => {
        document.title = cfg.brand;
        document.getElementById("brand").textContent = cfg.brand;
        document.getElementById("footer-brand").textContent = cfg.brand;
        if (cfg.tagline) document.getElementById("tagline").textContent = cfg.tagline;
        document.getElementById("login").href = cfg.account_url;

        // Logo : via la variable CSS --lastarter-logo-url (injectée par le thème).
        const logo = getComputedStyle(document.documentElement)
          .getPropertyValue("--lastarter-logo-url").trim();
        if (logo && logo !== 'url("")' && logo !== "none") {
          document.getElementById("brand-logo").style.backgroundImage = logo;
          document.getElementById("brand-logo").style.display = "inline-block";
        }

        const grid = document.getElementById("apps");
        for (const app of cfg.apps) {
          const a = document.createElement("a");
          a.className = "tile";
          a.href = app.url;
          a.innerHTML =
            '<span class="tile-icon" aria-hidden="true">' + (app.emoji || "◆") + "</span>" +
            '<span class="tile-name">' + app.name + "</span>" +
            '<span class="tile-desc">' + (app.description || "") + "</span>";
          grid.appendChild(a);
        }
        if (!cfg.apps.length) {
          grid.innerHTML =
            '<p class="empty">Aucune application activée pour ce déploiement.</p>';
        }
      })
      .catch(() => {
        document.getElementById("apps").innerHTML =
          '<p class="empty">Configuration du portail indisponible.</p>';
      });
  </script>
</body>
</html>
