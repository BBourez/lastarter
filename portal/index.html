<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LaStarter</title>
  <link rel="stylesheet" href="/__lastarter/theme.css" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-logo" id="brand-logo" aria-hidden="true"></span>
        <span class="brand-name" id="brand">LaStarter</span>
      </div>
      <nav class="sidebar-nav" id="nav" aria-label="Applications">
        <!-- Items générés depuis /portal-config.json -->
      </nav>
      <div class="sidebar-footer">
        <a class="btn-primary" id="login" href="#">Se connecter</a>
        <a href="/sources.html" class="sidebar-link">Mentions &amp; sources</a>
      </div>
    </aside>

    <main class="content">
      <header class="content-header">
        <h1 class="content-title" id="tagline">La suite collaborative de votre organisation.</h1>
        <p class="content-subtitle">Toutes vos applications, un seul point d'entrée.</p>
      </header>

      <section class="cards" id="apps" aria-label="Applications disponibles">
        <!-- Tuiles générées depuis /portal-config.json -->
      </section>
    </main>
  </div>

  <script>
    // Portail LaStarter — statique, zéro dépendance, configuré par le CLI.
    // Design : Compound (Element) — sidebar + contenu, boutons pilule.
    fetch("/portal-config.json")
      .then((r) => r.json())
      .then((cfg) => {
        document.title = cfg.brand;
        document.getElementById("brand").textContent = cfg.brand;
        if (cfg.tagline) document.getElementById("tagline").textContent = cfg.tagline;
        document.getElementById("login").href = cfg.account_url;

        const logo = getComputedStyle(document.documentElement)
          .getPropertyValue("--lastarter-logo-url").trim();
        if (logo && logo !== 'url("")' && logo !== "none") {
          document.getElementById("brand-logo").style.backgroundImage = logo;
        }

        // Navigation latérale (items) + cartes (contenu).
        const nav = document.getElementById("nav");
        const cards = document.getElementById("apps");
        for (const app of cfg.apps) {
          const navItem = document.createElement("a");
          navItem.className = "nav-item";
          navItem.href = app.url;
          navItem.innerHTML =
            '<span class="nav-icon" aria-hidden="true">' + (app.emoji || "◆") + "</span>" +
            '<span class="nav-label">' + app.name + "</span>";
          nav.appendChild(navItem);

          const card = document.createElement("a");
          card.className = "app-card";
          card.href = app.url;
          card.innerHTML =
            '<span class="card-icon" aria-hidden="true">' + (app.emoji || "◆") + "</span>" +
            '<span class="card-body">' +
              '<span class="card-name">' + app.name + "</span>" +
              '<span class="card-desc">' + (app.description || "") + "</span>" +
            "</span>";
          cards.appendChild(card);
        }
        if (!cfg.apps.length) {
          cards.innerHTML = '<p class="empty">Aucune application activée.</p>';
        }
      })
      .catch(() => {
        document.getElementById("apps").innerHTML =
          '<p class="empty">Configuration indisponible.</p>';
      });
  </script>
</body>
</html>
