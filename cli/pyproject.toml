[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastarter-cli"
version = "0.1.0"
description = "Installateur modulaire de la suite LaStarter (zéro dépendance)"
requires-python = ">=3.12"
license = { text = "Proprietary — code LaStarter" }

[project.scripts]
lastarter = "lastarter_cli.main:main"

[tool.setuptools.packages.find]
include = ["lastarter_cli*"]
